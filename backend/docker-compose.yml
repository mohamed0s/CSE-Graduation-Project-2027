services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: finda-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finda_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-finda_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - finda_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finda} -d ${POSTGRES_DB:-finda_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  finda_pgdata:
